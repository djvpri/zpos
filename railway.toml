# Railway Cron — terbitkan ZPos artikel otomatis tiap hari.
# Deploy service ini sebagai "Cron" di railway.app (bukan Next.js service).
#
# Schedule Quartz (UTC): "0 0 * * *" = tiap hari 00:00 UTC = 07:00 WIB.
#
# Variables yang WAJIB di-set di service ini:
#   DATABASE_URL     -> railway reference:  ${ZPOS_NEXT.DATABASE_URL}   (ganti nama service Next.js)
#   GEMINI_API_KEY   -> copas dr variable service Next.js / GH secret
#
# Ganti nama service Next.js di reference dibawah sebelum deploy kalau beda.
[deploy]
  service = "zpos-artikel-cron"
  type = "cron"

[deploy.cron]
  schedule = "0 0 * * *"
  command = "node scripts/artikel-harian.mjs"
